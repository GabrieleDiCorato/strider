[project]
name = "strider"
version = "0.1.0"
description = "My personal running coach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.16",
    "google-adk>=2.10.0",
    "pandera>=0.33.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
