<div id="sync-banner" style="display: flex; align-items: center; gap: var(--space-2);">
    {% if status == "success" %}
        <span class="badge" style="background-color: var(--color-status-good-bg); color: var(--color-status-good-text); border: 1px solid var(--color-status-good-border);">
            ✓ Synced ({{ total_count }} records)
        </span>
    {% elif status == "error" %}
        <span class="badge" style="background-color: var(--color-status-danger-bg); color: var(--color-status-danger-text); border: 1px solid var(--color-status-danger-border);" title="{{ error_message }}">
            ⚠ Sync Failed
        </span>
    {% endif %}
    <form hx-post="/api/sync" hx-target="#sync-banner" hx-swap="outerHTML" hx-indicator="#sync-spinner">
        <button class="btn btn--secondary" type="submit" id="sync-btn" style="position: relative;">
            <span id="sync-text">Sync Garmin</span>
            <span id="sync-spinner" class="htmx-indicator" style="margin-left: var(--space-2); gap: 6px;">
                <svg class="spinner-svg" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                Syncing...
            </span>
        </button>
    </form>
</div>
