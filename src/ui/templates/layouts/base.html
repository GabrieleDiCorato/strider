<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Strider{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script>
        (function() {
            var theme = document.cookie.match(/strider_theme=([^;]+)/);
            if (theme && theme[1]) {
                document.documentElement.setAttribute('data-theme', theme[1]);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    {% block head %}{% endblock %}
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--color-bg-canvas);
            color: var(--color-text-primary);
        }
        
        .desktop-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            border-right: 1px solid var(--color-border-subtle);
            padding: var(--space-6);
            background-color: var(--color-bg-surface);
        }

        .main-area {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow-y: auto;
        }

        .top-bar {
            height: 4rem;
            border-bottom: 1px solid var(--color-border-subtle);
            padding: 0 var(--space-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-bg-surface);
        }

        .content-container {
            padding: var(--space-8);
            max-width: var(--max-w-content);
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 1024px) {
            .desktop-container {
                display: block;
            }
            .sidebar {
                display: none;
            }
            .top-bar {
                padding: 0 var(--space-4);
            }
            .content-container {
                padding: var(--space-4);
                padding-bottom: 6rem;
            }
        }
        
        h1, h2, h3, h4 { font-family: var(--font-display); margin-top: 0; }
        .text-muted { color: var(--color-text-muted); }
        .font-mono { font-family: var(--font-mono); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-weight: var(--weight-medium);
            font-size: var(--text-sm);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            text-decoration: none;
            background: none;
        }
        
        .btn--primary {
            background-color: var(--color-brand-primary);
            color: white;
        }
        
        .btn--primary:hover {
            background-color: var(--color-brand-primary-hover);
        }
        
        .btn--secondary {
            background-color: var(--color-bg-surface-raised);
            border-color: var(--color-border-subtle);
            color: var(--color-text-primary);
        }
        
        .btn--secondary:hover {
            background-color: var(--color-bg-surface-active);
        }
        
        .card {
            background-color: var(--color-bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border-subtle);
            padding: var(--space-5);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-4);
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            background-color: var(--color-bg-surface-active);
            color: var(--color-text-secondary);
        }

        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-flex;
            align-items: center;
        }
        .htmx-request#sync-btn, .htmx-request #sync-btn, form.htmx-request button {
            opacity: 0.7;
            pointer-events: none;
            cursor: wait;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinner-svg {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
    
    <div id="toast-container" style="position: fixed; bottom: var(--space-4); right: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); z-index: 9999;"></div>

    <script>
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.cookie = "strider_theme=" + next + "; Path=/; Max-Age=31536000; SameSite=Lax";
        }

        function showToast(message, isError=false, persist=false) {
            if (persist) {
                sessionStorage.setItem('pendingToast', JSON.stringify({message, isError}));
            }
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.style.padding = 'var(--space-3) var(--space-4)';
            toast.style.borderRadius = 'var(--radius-md)';
            toast.style.color = '#fff';
            toast.style.backgroundColor = isError ? 'var(--color-status-danger)' : 'var(--color-brand-primary)';
            toast.style.boxShadow = 'var(--shadow-lg)';
            toast.style.opacity = '0';
            toast.style.transition = 'opacity var(--transition-normal)';
            toast.style.maxWidth = '400px';
            toast.style.wordBreak = 'break-word';
            toast.innerText = message;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.style.opacity = '1');
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pendingToast = sessionStorage.getItem('pendingToast');
            if (pendingToast) {
                try {
                    const t = JSON.parse(pendingToast);
                    showToast(t.message, t.isError, false);
                } catch(e) {}
                sessionStorage.removeItem('pendingToast');
            }
        });

        // Intercept global fetch calls for manual JS forms
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            try {
                const response = await originalFetch(...args);
                if (!response.ok) {
                    let errorMsg = `Error ${response.status}: ${response.statusText}`;
                    try {
                        const errBody = await response.clone().json();
                        if (errBody.detail) {
                            if (Array.isArray(errBody.detail)) {
                                errorMsg += " - " + errBody.detail.map(e => e.msg).join(", ");
                            } else {
                                errorMsg += " - " + errBody.detail;
                            }
                        }
                    } catch(e) {}
                    showToast(errorMsg, true);
                }
                return response;
            } catch (error) {
                showToast(`Network Error: ${error.message}`, true);
                throw error;
            }
        };

        // Intercept HTMX errors
        document.body.addEventListener('htmx:responseError', function(evt) {
            let errorMsg = `HTMX Error ${evt.detail.xhr.status}: ${evt.detail.xhr.statusText}`;
            try {
                const errBody = JSON.parse(evt.detail.xhr.response);
                if (errBody.detail) {
                    if (Array.isArray(errBody.detail)) {
                        errorMsg += " - " + errBody.detail.map(e => e.msg).join(", ");
                    } else {
                        errorMsg += " - " + errBody.detail;
                    }
                }
            } catch(e) {}
            showToast(errorMsg, true);
        });
        document.body.addEventListener('htmx:sendError', function(evt) {
            showToast(`HTMX Network Error`, true);
        });
    </script>
</body>
</html>
