<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Strider{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    <script>
        (function() {
            var theme = document.cookie.match(/strider_theme=([^;]+)/);
            if (theme && theme[1]) {
                document.documentElement.setAttribute('data-theme', theme[1]);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    {% block head %}{% endblock %}
    <style>
        body {
            margin: 0;
            font-family: var(--font-sans);
            background-color: var(--color-bg-canvas);
            color: var(--color-text-primary);
        }
        
        .desktop-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            border-right: 1px solid var(--color-border-subtle);
            padding: var(--space-6);
            background-color: var(--color-bg-surface);
        }

        .main-area {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow-y: auto;
        }

        .top-bar {
            height: 4rem;
            border-bottom: 1px solid var(--color-border-subtle);
            padding: 0 var(--space-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-bg-surface);
        }

        .content-container {
            padding: var(--space-8);
            max-width: var(--max-w-content);
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 1024px) {
            .desktop-container {
                display: block;
            }
            .sidebar {
                display: none;
            }
            .top-bar {
                padding: 0 var(--space-4);
            }
            .content-container {
                padding: var(--space-4);
                padding-bottom: 6rem;
            }
        }
        
        h1, h2, h3, h4 { font-family: var(--font-display); margin-top: 0; }
        .text-muted { color: var(--color-text-muted); }
        .font-mono { font-family: var(--font-mono); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-weight: var(--weight-medium);
            font-size: var(--text-sm);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            text-decoration: none;
            background: none;
        }
        
        .btn--primary {
            background-color: var(--color-brand-primary);
            color: white;
        }
        
        .btn--primary:hover {
            background-color: var(--color-brand-primary-hover);
        }
        
        .btn--secondary {
            background-color: var(--color-bg-surface-raised);
            border-color: var(--color-border-subtle);
            color: var(--color-text-primary);
        }
        
        .btn--secondary:hover {
            background-color: var(--color-bg-surface-active);
        }
        
        .card {
            background-color: var(--color-bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border-subtle);
            padding: var(--space-5);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-4);
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            background-color: var(--color-bg-surface-active);
            color: var(--color-text-secondary);
        }

        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        .htmx-request#sync-btn, .htmx-request #sync-btn, form.htmx-request button {
            opacity: 0.7;
            pointer-events: none;
            cursor: wait;
        }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
    
    <script>
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.cookie = "strider_theme=" + next + "; Path=/; Max-Age=31536000; SameSite=Lax";
        }
    </script>
</body>
</html>
